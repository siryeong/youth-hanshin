<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#F4F0E7;color:#171310;font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
    a{color:#A8475E;text-decoration:none} a:hover{color:#8C374C}
    .mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-feature-settings:"tnum"}
    button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left;padding:0}
    .rowlab{font-size:14px; font-weight:500}
    .sub{font-size:12px; color:#7C7268}
  </style>
</helmet>
<div style="height:844px; display:flex; flex-direction:column; justify-content:flex-end; background:#F4F0E7; overflow:hidden; position:relative">

  <div style="position:absolute; top:0; left:0; right:0; bottom:0; padding:16px 20px; display:flex; flex-direction:column; gap:12px">
    <div style="display:flex; align-items:center; justify-content:space-between">
      <span style="font-size:22px; font-weight:600; letter-spacing:-0.02em">청년부 카페</span>
      <span class="mono" style="font-size:12px; color:#7C7268">14:30 마감</span>
    </div>
    <div style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px">
      <div style="height:132px; border-radius:16px; background:#FFFFFF"></div>
      <div style="height:132px; border-radius:16px; background:#FFFFFF"></div>
      <div style="height:132px; border-radius:16px; background:#FFFFFF"></div>
      <div style="height:132px; border-radius:16px; background:#FFFFFF"></div>
    </div>
  </div>

  <div style="position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(23,19,16,0.32)"></div>

  <div style="position:relative; background:#FFFFFF; border-radius:22px 22px 0 0; padding:12px 20px 20px; display:flex; flex-direction:column; gap:18px">

    <span style="width:40px; height:4px; border-radius:999px; background:#DFD6C6; align-self:center"></span>

    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px">
      <div style="display:flex; flex-direction:column; gap:4px">
        <span style="font-size:22px; font-weight:600; letter-spacing:-0.02em">아메리카노</span>
        <span class="sub">커피</span>
      </div>
      <span style="width:44px; height:44px; border-radius:999px; background:#EAE3D6; display:flex; align-items:center; justify-content:center; color:#4A423A; margin:-6px -6px 0 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </span>
    </div>

    <div style="display:flex; flex-direction:column; gap:10px">
      <span class="rowlab">온도</span>
      <div style="display:flex; gap:8px">
        <sc-for list="{{ temps }}" as="temp" hint-placeholder-count="2">
          <button onClick="{{ temp.pick }}" style="flex:1; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:15px; background: {{temp.bg}}; color: {{temp.fg}}; font-weight: {{temp.weight}}">{{ temp.label }}</button>
        </sc-for>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px">
        <div style="display:flex; flex-direction:column; gap:2px">
          <span class="rowlab">샷 추가</span>
          <span class="sub">최대 2샷</span>
        </div>
        <div style="display:flex; align-items:center; border-radius:12px; height:44px; padding:0 2px; background:#EAE3D6">
          <button onClick="{{ shotDown }}" style="width:44px; height:44px; display:flex; align-items:center; justify-content:center; color: {{shotDownColor}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12"></path></svg></button>
          <span class="mono" style="width:32px; text-align:center; font-size:15px; font-weight:500">{{ shot }}</span>
          <button onClick="{{ shotUp }}" style="width:44px; height:44px; display:flex; align-items:center; justify-content:center; color: {{shotUpColor}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 6v12M6 12h12"></path></svg></button>
        </div>
      </div>

      <div style="height:1px"></div>

      <button onClick="{{ toggleLight }}" style="display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:44px">
        <div style="display:flex; flex-direction:column; gap:2px">
          <span class="rowlab">연하게</span>
          <span class="sub">물을 더 넣어요</span>
        </div>
        <span style="width:52px; height:32px; border-radius:999px; padding:3px; display:flex; align-items:center; background: {{lightTrack}}; justify-content: {{lightAlign}}">
          <span style="width:26px; height:26px; border-radius:999px; background:#FFFFFF"></span>
        </span>
      </button>

      <div style="height:1px"></div>

      <button onClick="{{ toggleSyrup }}" style="display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:44px">
        <div style="display:flex; flex-direction:column; gap:2px">
          <span class="rowlab">시럽 추가</span>
          <span class="sub">바닐라 시럽 1펌프</span>
        </div>
        <span style="width:52px; height:32px; border-radius:999px; padding:3px; display:flex; align-items:center; background: {{syrupTrack}}; justify-content: {{syrupAlign}}">
          <span style="width:26px; height:26px; border-radius:999px; background:#FFFFFF"></span>
        </span>
      </button>

      <div style="height:1px"></div>

      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px">
        <span class="rowlab">수량</span>
        <div style="display:flex; align-items:center; border-radius:12px; height:44px; padding:0 2px; background:#EAE3D6">
          <button onClick="{{ qtyDown }}" style="width:44px; height:44px; display:flex; align-items:center; justify-content:center; color: {{qtyDownColor}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12"></path></svg></button>
          <span class="mono" style="width:32px; text-align:center; font-size:15px; font-weight:500">{{ qty }}</span>
          <button onClick="{{ qtyUp }}" style="width:44px; height:44px; display:flex; align-items:center; justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 6v12M6 12h12"></path></svg></button>
        </div>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:8px; background:#EAE3D6; border-radius:12px; padding:12px 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A423A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h11v7a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V8Z"></path><path d="M16 9.5h1.5a2.5 2.5 0 0 1 0 5H16"></path></svg>
      <span style="font-size:13px; color:#4A423A; flex:1">{{ summary }}</span>
    </div>

    <button style="height:52px; border-radius:14px; background:#171310; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600">장바구니에 담기</button>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props){
    super(props)
    this.state = { temp: 'ice', shot: 1, light: false, syrup: false, qty: 2 }
  }
  renderVals(){
    const s = this.state
    const on = { bg: '#F2CCD5', fg: '#171310', weight: '600' }
    const off = { bg: '#EAE3D6', fg: '#4A423A', weight: '500' }
    const temps = [{ id: 'ice', label: 'ICE' }, { id: 'hot', label: 'HOT' }].map((t) => {
      const st = s.temp === t.id ? on : off
      return { id: t.id, label: t.label, bg: st.bg, fg: st.fg, weight: st.weight, pick: () => this.setState({ temp: t.id }) }
    })
    const parts = [s.temp === 'ice' ? 'ICE' : 'HOT']
    if(s.shot > 0) parts.push('샷 ' + s.shot)
    if(s.light) parts.push('연하게')
    if(s.syrup) parts.push('시럽')
    parts.push(s.qty + '잔')
    return {
      temps,
      shot: s.shot,
      qty: s.qty,
      summary: parts.join(' · '),
      shotDownColor: s.shot > 0 ? '#171310' : '#DFD6C6',
      shotUpColor: s.shot < 2 ? '#171310' : '#DFD6C6',
      qtyDownColor: s.qty > 1 ? '#171310' : '#DFD6C6',
      lightTrack: s.light ? '#171310' : '#DFD6C6',
      lightAlign: s.light ? 'flex-end' : 'flex-start',
      syrupTrack: s.syrup ? '#171310' : '#DFD6C6',
      syrupAlign: s.syrup ? 'flex-end' : 'flex-start',
      shotUp: () => this.setState({ shot: Math.min(2, s.shot + 1) }),
      shotDown: () => this.setState({ shot: Math.max(0, s.shot - 1) }),
      qtyUp: () => this.setState({ qty: Math.min(9, s.qty + 1) }),
      qtyDown: () => this.setState({ qty: Math.max(1, s.qty - 1) }),
      toggleLight: () => this.setState({ light: !s.light }),
      toggleSyrup: () => this.setState({ syrup: !s.syrup })
    }
  }
}
</script>
</body>
</html>
