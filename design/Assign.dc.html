<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#F4F0E7;color:#171310;font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
    a{color:#A8475E;text-decoration:none} a:hover{color:#8C374C}
    .mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-feature-settings:"tnum"}
    button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:left;padding:0}
    .nav{display:flex; align-items:center; gap:10px; height:40px; padding:0 12px; border-radius:10px; font-size:14px; color:#4A423A}
    .nav-on{background:#171310; color:#FFFFFF; font-weight:500}
    .scroll{overflow-y:auto}
    .scroll::-webkit-scrollbar{width:6px}
    .scroll::-webkit-scrollbar-thumb{background:#DFD6C6;border-radius:999px}
  </style>
</helmet>
<div style="width:1440px; height:920px; display:flex; background:#F4F0E7; overflow:hidden">

  <div style="width:240px; flex-shrink:0; background:#FFFFFF; display:flex; flex-direction:column; padding:20px 14px; gap:22px">
    <div style="display:flex; align-items:center; gap:10px; padding:0 6px">
      <span style="width:34px; height:34px; border-radius:11px; background:#171310; color:#F2CCD5; display:flex; align-items:center; justify-content:center">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h11v7a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V8Z"></path><path d="M16 9.5h1.5a2.5 2.5 0 0 1 0 5H16"></path></svg>
      </span>
      <span style="font-size:15px; font-weight:600; letter-spacing:-0.01em">청년부</span>
    </div>
    <div style="display:flex; flex-direction:column; gap:3px">
      <span class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg>청년부 운영</span>
      <span class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h11v7a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V8Z"></path><path d="M16 9.5h1.5a2.5 2.5 0 0 1 0 5H16"></path></svg>카페 운영</span>
      <span class="nav nav-on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3.6 20a5.6 5.6 0 0 1 10.8 0"></path><path d="M16 5.6a3 3 0 0 1 0 5.4"></path><path d="M17.6 20a5.8 5.8 0 0 0-2.2-4.4"></path></svg>마을 운영</span>
      <span class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12V21l-3-1.6L12 21l-3-1.6L6 21V3.5Z"></path><path d="M9.5 9h5M9.5 13h5"></path></svg>전체 소식</span>
    </div>
    <div style="margin-top:auto; display:flex; align-items:center; gap:10px; padding:12px; border-radius:12px; background:#F4F0E7">
      <span style="width:32px; height:32px; border-radius:999px; background:#171310; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600">한</span>
      <span style="flex:1; display:flex; flex-direction:column; gap:2px">
        <span style="font-size:13px; font-weight:500">한지훈</span>
        <span style="font-size:11px; color:#7C7268">목회자</span>
      </span>
      <span style="width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:#7C7268"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"></path></svg></span>
    </div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; min-width:0">

    <div style="display:flex; align-items:center; justify-content:space-between; gap:20px; padding:20px 28px 16px; background:#FFFFFF">
      <div style="display:flex; align-items:center; gap:14px">
        <span style="font-size:24px; font-weight:600; letter-spacing:-0.02em">마을 편성</span>
        <span style="display:flex; align-items:center; gap:8px; height:36px; padding:0 12px; border-radius:10px; font-size:13px; font-weight:500; background:#EAE3D6">
          3기 · 2026
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9.5 6 6 6-6"></path></svg>
        </span>
      </div>
      <div style="display:flex; align-items:center; gap:10px">
        <span style="font-size:13px; color:#7C7268">정렬</span>
        <span style="display:flex; gap:3px; padding:3px; background:#EAE3D6; border-radius:10px">
          <span style="height:30px; padding:0 12px; border-radius:8px; background:#FFFFFF; font-size:13px; font-weight:500; display:flex; align-items:center">나이순</span>
          <span style="height:30px; padding:0 12px; border-radius:8px; font-size:13px; color:#7C7268; display:flex; align-items:center">성별순</span>
          <span style="height:30px; padding:0 12px; border-radius:8px; font-size:13px; color:#7C7268; display:flex; align-items:center">이름순</span>
        </span>
        <span style="height:36px; padding:0 14px; border-radius:10px; background:#171310; color:#FFFFFF; font-size:13px; font-weight:500; display:flex; align-items:center; gap:7px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 6v12M6 12h12"></path></svg>
          마을 추가
        </span>
      </div>
    </div>

    <div style="flex:1; display:flex; gap:20px; padding:20px 28px; min-height:0">

      <div style="width:300px; flex-shrink:0; background:#FFFFFF; border-radius:16px; display:flex; flex-direction:column; overflow:hidden">
        <div style="padding:16px 16px 12px; display:flex; align-items:center; justify-content:space-between">
          <span style="font-size:14px; font-weight:600">미배정</span>
          <span class="mono" style="font-size:12px; background:#EAE3D6; padding:4px 9px; border-radius:999px">{{ unassignedCount }}명</span>
        </div>
        <div class="scroll" style="flex:1; padding:10px; display:flex; flex-direction:column; gap:6px">
          <sc-for list="{{ unassigned }}" as="p" hint-placeholder-count="6">
            <button onClick="{{ p.toggle }}" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:11px; background: {{p.bg}}; width:100%">
              <span style="width:18px; height:18px; border-radius:6px; display:flex; align-items:center; justify-content:center; background: {{p.boxBg}}; color: {{p.boxFg}}; flex-shrink:0">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
              </span>
              <span style="flex:1; display:flex; flex-direction:column; gap:2px">
                <span style="font-size:14px; font-weight:500">{{ p.name }}</span>
                <span style="font-size:12px; color:#7C7268">{{ p.meta }}</span>
              </span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="#DFD6C6"><circle cx="9" cy="6" r="1.4"></circle><circle cx="15" cy="6" r="1.4"></circle><circle cx="9" cy="12" r="1.4"></circle><circle cx="15" cy="12" r="1.4"></circle><circle cx="9" cy="18" r="1.4"></circle><circle cx="15" cy="18" r="1.4"></circle></svg>
            </button>
          </sc-for>
        </div>
        <div style="padding:12px 16px; display:flex; align-items:center; gap:8px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A79E93" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8.2"></circle><path d="M12 11v5.2M12 8v.4"></path></svg>
          <span style="font-size:12px; color:#A79E93; line-height:1.5">끌어다 놓거나, 골라서 아래 버튼으로 옮겨요</span>
        </div>
      </div>

      <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:14px">
        <div class="scroll" style="flex:1; display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:16px; align-content:start; padding-right:4px">
          <sc-for list="{{ villages }}" as="v" hint-placeholder-count="4">
            <div style="background: {{v.bg}}; border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px; min-height:250px">
              <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:10px">
                <span style="display:flex; flex-direction:column; gap:4px">
                  <span style="font-size:17px; font-weight:600">{{ v.name }}</span>
                  <span style="font-size:12px; color:#7C7268">{{ v.leader }}</span>
                </span>
                <span class="mono" style="font-size:12px; background:#EAE3D6; padding:4px 9px; border-radius:999px">{{ v.count }}명</span>
              </div>
              <div style="display:flex; align-items:center; gap:8px; padding:9px 11px; border-radius:10px; background:#F4F0E7">
                <span class="mono" style="font-size:12px; color:#4A423A">{{ v.ratio }}</span>
                <span style="width:1px; height:11px; background:#DFD6C6"></span>
                <span class="mono" style="font-size:12px; color:#4A423A">{{ v.avg }}</span>
              </div>
              <div style="flex:1; display:flex; flex-wrap:wrap; gap:6px; align-content:flex-start">
                <sc-for list="{{ v.members }}" as="m" hint-placeholder-count="4">
                  <span style="display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 10px; border-radius:999px; background:#EAE3D6; font-size:13px">
                    {{ m.name }}
                    <span class="mono" style="font-size:11px; color:#7C7268">{{ m.short }}</span>
                  </span>
                </sc-for>
              </div>
              <button onClick="{{ v.drop }}" style="height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:13px; font-weight:500; background: {{v.btnBg}}; color: {{v.btnFg}}">{{ v.btnLabel }}</button>
            </div>
          </sc-for>
        </div>

        <div style="display:flex; align-items:center; gap:14px; padding:14px 18px; border-radius:14px; background: {{barBg}}">
          <span style="font-size:14px; font-weight:500; color: {{barFg}}; flex:1">{{ barLabel }}</span>
          <button onClick="{{ clear }}" style="height:36px; padding:0 14px; border-radius:10px; font-size:13px; font-weight:500; color: {{barBtnFg}}; background: {{barBtnBg}}">선택 해제</button>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":920}}'>
const PEOPLE = [
  { id: 'p1', name: '김하늘', g: '여', age: 26, v: 'sarang', leader: true },
  { id: 'p2', name: '이도현', g: '남', age: 24, v: 'sarang' },
  { id: 'p3', name: '정민재', g: '남', age: 27, v: 'sarang' },
  { id: 'p4', name: '최유진', g: '여', age: 25, v: 'sarang' },
  { id: 'p5', name: '한서준', g: '남', age: 29, v: 'somang', leader: true },
  { id: 'p6', name: '오예린', g: '여', age: 23, v: 'somang' },
  { id: 'p7', name: '배준호', g: '남', age: 31, v: 'somang' },
  { id: 'p8', name: '윤가온', g: '여', age: 22, v: 'mideum' },
  { id: 'p9', name: '신아름', g: '여', age: 28, v: 'mideum' },
  { id: 'p10', name: '박서윤', g: '여', age: 24, v: null },
  { id: 'p11', name: '조은우', g: '남', age: 26, v: null },
  { id: 'p12', name: '문지안', g: '여', age: null, v: null },
  { id: 'p13', name: '강태오', g: '남', age: 30, v: null },
  { id: 'p14', name: '서하람', g: '여', age: 21, v: null },
  { id: 'p15', name: '노경민', g: '남', age: 25, v: null }
]

const VILLAGES = [
  { id: 'sarang', name: '사랑마을' },
  { id: 'somang', name: '소망마을' },
  { id: 'mideum', name: '믿음마을' },
  { id: 'eunhye', name: '은혜마을' }
]

class Component extends DCLogic {
  constructor(props){
    super(props)
    this.state = { people: PEOPLE, picked: { p11: true, p14: true } }
  }
  renderVals(){
    const people = this.state.people
    const picked = this.state.picked
    const pickedIds = Object.keys(picked).filter((k) => picked[k])
    const hasPick = pickedIds.length > 0

    const unassigned = people.filter((p) => !p.v).map((p) => {
      const on = !!picked[p.id]
      return {
        id: p.id,
        name: p.name,
        meta: p.g + ' · ' + (p.age === null ? '나이 미상' : p.age + '세'),
        bg: on ? '#F2CCD5' : 'transparent',
        boxBg: on ? '#171310' : '#DFD6C6',
        boxFg: on ? '#FFFFFF' : '#DFD6C6',
        toggle: () => {
          const next = Object.assign({}, this.state.picked)
          if(next[p.id]) delete next[p.id]
          else next[p.id] = true
          this.setState({ picked: next })
        }
      }
    })

    const villages = VILLAGES.map((v) => {
      const members = people.filter((p) => p.v === v.id)
      const male = members.filter((m) => m.g === '남').length
      const female = members.length - male
      const known = members.filter((m) => m.age !== null)
      const avg = known.length ? (known.reduce((s, m) => s + m.age, 0) / known.length).toFixed(1) + '세' : '평균 미상'
      const leader = members.find((m) => m.leader)
      return {
        id: v.id,
        name: v.name,
        count: members.length,
        leader: leader ? '이장 ' + leader.name : '이장 없음',
        ratio: '남 ' + male + ' · 여 ' + female,
        avg: known.length ? '평균 ' + avg : '평균 미상',
        bg: hasPick ? '#F9E5EA' : '#FFFFFF',
        btnBg: hasPick ? '#171310' : '#EAE3D6',
        btnFg: hasPick ? '#FFFFFF' : '#A79E93',
        btnLabel: hasPick ? pickedIds.length + '명 여기로' : '여기로 배정',
        members: members.map((m) => ({
          id: m.id,
          name: m.name,
          short: m.g + (m.age === null ? '' : ' ' + m.age)
        })),
        drop: () => {
          if(!hasPick) return
          const next = people.map((p) => (picked[p.id] ? Object.assign({}, p, { v: v.id, leader: false }) : p))
          this.setState({ people: next, picked: {} })
        }
      }
    })

    return {
      unassigned,
      unassignedCount: unassigned.length,
      villages,
      barBg: hasPick ? '#F9E5EA' : '#FFFFFF',
      barBtnBg: hasPick ? '#FFFFFF' : '#EAE3D6',
      barFg: hasPick ? '#171310' : '#A79E93',
      barBtnFg: hasPick ? '#171310' : '#A79E93',
      barLabel: hasPick
        ? pickedIds.length + '명 선택됨 — 옮길 마을 카드의 버튼을 누르세요'
        : '옮길 사람을 왼쪽에서 고르거나, 마을 카드로 끌어다 놓으세요',
      clear: () => this.setState({ picked: {} })
    }
  }
}
</script>
</body>
</html>
